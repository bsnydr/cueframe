[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cueframe"
version = "0.1.0"
description = "A frame-exact timeline that turns audio cues into animation or multicamera edits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ben Snyder" }]
keywords = ["video", "audio", "timeline", "animation", "multicamera", "ffmpeg", "gcc-phat"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10.1,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.5,<1",
]

[project.scripts]
cueframe = "cueframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is used deliberately in tests and invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH", "slow: longer end-to-end runs"]
