name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Quick demos
        if: matrix.python-version == '3.12'
        run: python scripts/demo.py --out /tmp/cueframe-demo --quick
      - name: Publish check
        run: python scripts/check_publish.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: quick-demos-py${{ matrix.python-version }}
          path: |
            /tmp/cueframe-demo/animation/animation.mp4
            /tmp/cueframe-demo/animation/animation_sheet.png
            /tmp/cueframe-demo/multicam/edit.mp4
            /tmp/cueframe-demo/multicam/lag_chart.png
            /tmp/cueframe-demo/multicam/multicam_sheet.png
            /tmp/cueframe-demo/multicam/summary.json
          if-no-files-found: error
